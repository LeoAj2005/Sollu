name: sollu
description: A Flutter app that downloads lyrics for the song you're listening to.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  http: ^1.1.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  permission_handler: ^11.0.0
  shared_preferences: ^2.5.3
  go_router: ^12.0.0
  cached_network_image: ^3.3.0
  path: ^1.8.3  # Added missing dependency
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true